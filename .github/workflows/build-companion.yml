
name: Build CrowPlayer Companion APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/crowplayer-0.6.0'
    paths:
      - "android/**"
      - ".github/workflows/build-companion.yml"

concurrency:
  group: crowplayer-android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle -p android :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CrowPlayer-Companion-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
