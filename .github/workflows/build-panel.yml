name: Build CrowPanel firmware
on:
  push:
    branches: [feature/crowplayer-0.6.0]
    paths: ['firmware/**', 'scripts/panel-*', '.github/workflows/build-panel.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  panel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test protocol and inputs
        run: |
          mkdir -p build
          g++ -std=c++17 -Wall -Wextra -fsanitize=address,undefined -g firmware/tests/core_test.cpp -o build/panel_tests
          ./build/panel_tests
      - name: Generate Cyrillic fonts
        run: bash scripts/panel-assets.sh
      - name: Render actual firmware UI
        run: |
          git clone --depth 1 --branch v9.1.0 https://github.com/lvgl/lvgl.git build/lvgl
          cmake -S firmware/preview -B build/preview-app -DLVGL_DIR="$PWD/build/lvgl" -DCMAKE_BUILD_TYPE=Release
          cmake --build build/preview-app --target panel_preview -j4
          ./build/preview-app/panel_preview build/preview
          python -m pip install Pillow==11.3.0
          python scripts/panel-preview.py build/preview
      - uses: arduino/setup-arduino-cli@v2
      - uses: actions/cache/restore@v4
        id: arduino-cache
        with:
          path: |
            ~/.arduino15
            ~/Arduino/libraries
          key: crowpanel-arduino-338-lvgl910-lgfx1226-v1
      - name: Install pinned Arduino dependencies
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.8
          arduino-cli lib install 'LovyanGFX@1.2.26' 'Adafruit NeoPixel@1.15.1' 'ArduinoJson@6.21.5' 'lvgl@9.1.0'
      - uses: actions/cache/save@v4
        if: steps.arduino-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.arduino15
            ~/Arduino/libraries
          key: crowpanel-arduino-338-lvgl910-lgfx1226-v1
      - name: Compile ESP32-S3R8 native USB
        run: |
          arduino-cli compile --fqbn 'esp32:esp32:esp32s3:USBMode=default,CDCOnBoot=default,FlashSize=16M,PartitionScheme=app3M_fat9M_16MB,PSRAM=opi' --build-property 'compiler.cpp.extra_flags=-DLV_CONF_SKIP' --build-property 'compiler.c.extra_flags=-DLV_CONF_SKIP' --build-property 'compiler.S.extra_flags=-DLV_CONF_SKIP' --output-dir build/panel firmware/CrowPlayer
      - name: Verify ESP32 display buffer alignment
        run: python scripts/panel-check-map.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CrowPanel-firmware-and-preview
          path: |
            build/panel
            build/preview/*.png
          if-no-files-found: error
